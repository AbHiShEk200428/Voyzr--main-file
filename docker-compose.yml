services:
  # 1. PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: voyzr-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: voyzr
      POSTGRES_PASSWORD: voyzr_pass
      POSTGRES_DB: voyzr_db
    volumes:
      - postgres_voyzr_data:/var/lib/postgresql/data

  # 2. MongoDB
  mongodb:
    image: mongo:latest
    container_name: voyzr-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_voyzr_data:/data/db

  # 3. Redis
  redis:
    image: redis:alpine
    container_name: voyzr-redis
    ports:
      - "6379:6379"

  # 4. Kafka & Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: voyzr-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: voyzr-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: voyzr-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 5. pgAdmin (Web Browser for Database)
  pgadmin:
    image: dpage/pgadmin4
    container_name: voyzr-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@voyzr.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_voyzr_data:
  mongodb_voyzr_data:
