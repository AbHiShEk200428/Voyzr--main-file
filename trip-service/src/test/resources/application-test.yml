# This file is used ONLY during tests (when @ActiveProfiles("test") is present)
# It replaces PostgreSQL with H2 (an in-memory database that needs no installation)

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop  # Fresh schema for each test run
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

jwt:
  secret: voyzr-super-secret-key-must-be-at-least-32-characters-long-for-HS256
  expiration: 86400000
