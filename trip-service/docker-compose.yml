version: '3.8'

# Docker Compose spins up all the infrastructure your service depends on.
# Run this FIRST before starting the Spring Boot app.

services:

  # PostgreSQL — main database for Trip Service
  postgres:
    image: postgres:15-alpine          # Lightweight PostgreSQL image
    container_name: voyzr-postgres
    environment:
      POSTGRES_DB: voyzr_trips         # Database name (matches application.yml)
      POSTGRES_USER: voyzr_user        # Username
      POSTGRES_PASSWORD: voyzr_pass    # Password
    ports:
      - "5432:5432"                    # host_port:container_port
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persist data between restarts

  # pgAdmin — visual database browser (optional but very useful)
  pgadmin:
    image: dpage/pgadmin4
    container_name: voyzr-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@voyzr.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"                      # Visit http://localhost:5050 to browse DB
    depends_on:
      - postgres

volumes:
  postgres_data:    # Named volume — data survives container restarts
